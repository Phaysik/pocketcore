name: 'Run coverage and upload to CodeCov'

on:
  push:
    branches:
      - master
    paths:
      [
        '**.c',
        '**.cpp',
        '**.h',
        '**.hpp',
        '**.cxx',
        '**.hxx',
        '**.cc',
        '**.hh',
        'Makefile',
        '**CMakeLists.txt',
        'meson.build',
        '**.cmake',
        '**CMakePresets.json',
        '.github/workflows/coverage.yml',
        '.github/docker/coverage/**',
        'vcpkg.json',
      ]
  pull_request:
    branches:
      - master
    paths:
      [
        '**.c',
        '**.cpp',
        '**.h',
        '**.hpp',
        '**.cxx',
        '**.hxx',
        '**.cc',
        '**.hh',
        'Makefile',
        '**CMakeLists.txt',
        'meson.build',
        '**.cmake',
        '**CMakePresets.json',
        '.github/workflows/coverage.yml',
        '.github/docker/coverage/**',
        'vcpkg.json',
      ]

jobs:
  image:
    name: Coverage toolchain image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute image tag
        id: meta
        run: echo "image=ghcr.io/phaysik/pocketcore-coverage:${{ hashFiles('.github/docker/coverage/**') }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing image
        id: exists
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .github/docker/coverage
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=coverage-image
          cache-to: type=gha,mode=max,scope=coverage-image

  test:
    name: Coverage
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      actions: read
      pull-requests: write
      checks: write
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
            fetch-depth: 0

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.temp }}/vcpkg'

      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=${{ runner.temp }}/vcpkg" >> "$GITHUB_ENV"

      - name: Build & run coverage
        run: |
            cmake --preset coverage
            cmake --build --preset coverage

      # Optional HMTL report for humans (won't fail the job)
      - name: Generate HTML report
        run: cmake --build --preset genhtml || true

      - name: Prepare Codecov report by removing excluded branch records
        run: |
          awk '!/^BRDA:[0-9]+,[ef]?U[0-9]+,/' \
            build/coverage/coverage.info \
            > build/coverage/coverage.codecov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage/coverage.codecov.info
          disable_search: true # only upload the curated report, don't scan the repo
          plugins: noop # don't run the gcov plugin, which would re-derive coverage (incl. tests/) from build artifacts
          flags: unittests
          name: gcc-coverage
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      # Upload artifacts (xml/info/html) so they survive the run
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
            name: coverage-report
            path: |
                build/coverage/coverage.info
                build/coverage/coverage.codecov.info
                build/coverage/coverage/
            if-no-files-found: warn
